<script>

let degreeMode = true;

let lastAnswer = 0;


function display(){

    return document.getElementById("display");

}


function add(value){

    display().value += value;

}


function addFunction(name){

    display().value += name + "(";

}


function clearAll(){

    display().value = "";

}


function backspace(){

    display().value =
    display().value.slice(0,-1);

}


function toggleMode(){

    degreeMode = !degreeMode;

    document.getElementById("mode").innerText =
    degreeMode ? "DEG" : "RAD";

}


function square(){

    display().value += "^2";

}


function factorial(){

    let value =
    Number(display().value);

    if(value < 0 || !Number.isInteger(value)){

        display().value = "Error";

        return;

    }

    let result = 1;

    for(let i=1;i<=value;i++){

        result *= i;

    }

    display().value = result;

}


function answer(){

    display().value += lastAnswer;

}


function calculate(){

    let expression = display().value;

    try{

        expression =
        expression.replaceAll("π","Math.PI");

        expression =
        expression.replaceAll("e","Math.E");

        expression =
        expression.replaceAll("^","**");

        expression =
        expression.replaceAll("sqrt(","Math.sqrt(");

        expression =
        expression.replaceAll("log(","Math.log10(");

        expression =
        expression.replaceAll("ln(","Math.log(");
       if (degreeMode) {

    expression = expression.replace(
        /sin\(([^()]*)\)/g,
        function(match, value) {
            return "Math.sin((" + value + ")*Math.PI/180)";
        }
    );

    expression = expression.replace(
        /cos\(([^()]*)\)/g,
        function(match, value) {
            return "Math.cos((" + value + ")*Math.PI/180)";
        }
    );

    expression = expression.replace(
        /tan\(([^()]*)\)/g,
        function(match, value) {
            return "Math.tan((" + value + ")*Math.PI/180)";
        }
    );

    expression = expression.replace(
        /asin\(([^()]*)\)/g,
        function(match, value) {
            return "(180/Math.PI)*Math.asin(" + value + ")";
        }
    );

    expression = expression.replace(
        /acos\(([^()]*)\)/g,
        function(match, value) {
            return "(180/Math.PI)*Math.acos(" + value + ")";
        }
    );

    expression = expression.replace(
        /atan\(([^()]*)\)/g,
        function(match, value) {
            return "(180/Math.PI)*Math.atan(" + value + ")";
        }
    );

} else {

    expression = expression.replaceAll(
        "sin(",
        "Math.sin("
    );

    expression = expression.replaceAll(
        "cos(",
        "Math.cos("
    );

    expression = expression.replaceAll(
        "tan(",
        "Math.tan("
    );

    expression = expression.replaceAll(
        "asin(",
        "Math.asin("
    );

    expression = expression.replaceAll(
        "acos(",
        "Math.acos("
    );

    expression = expression.replaceAll(
        "atan(",
        "Math.atan("
    );

    }


        let result =
        Function(
            '"use strict"; return (' +
            expression +
            ')'
        )();


        if(!Number.isFinite(result)){

            throw new Error();

        }


        lastAnswer = result;

        display().value = result;

    }

    catch(error){

        display().value = "Error";

    }

}

</script>
