<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#e0f2fe,#f8fafc);
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 7%;

    box-shadow:0 2px 10px rgba(0,0,0,.1);

.logo{

    font-weight:bold;
}

.nav a{
    text-decoration:none;

}

.container{
    max-width:700px;
    margin:30px auto;
    padding:15px;
}

h1{
    text-align:center;
}

.calculator{
    background:#1f2937;

#display{

    .buttons{

<body>

<div class="container">

<h1>🧮 Scientific Calculator</h1>

<p style="text-align:center;">
Scientific Calculator for CSE & Engineering Students
</p>


<div class="calculator">

<input id="display" type="text" readonly>


<div class="top">

<button onclick="toggleMode()" id="mode">
DEG
</button>

<button onclick="clearDisplay()" class="clear">
AC
</button>

<button onclick="backspace()">
⌫
</button>

</div>


<div class="buttons">


<button class="function" onclick="func('sin')">sin</button>

<button class="function" onclick="func('cos')">cos</button>

<button class="function" onclick="func('tan')">tan</button>

<button class="function" onclick="func('asin')">sin⁻¹</button>

<button class="function" onclick="func('acos')">cos⁻¹</button>


<button class="function" onclick="func('atan')">tan⁻¹</button>

<button class="function" onclick="func('sqrt')">√</button>

<button class="function" onclick="func('log')">log</button>

<button class="function" onclick="func('ln')">ln</button>

<button class="function" onclick="square()">x²</button>


<button class="function" onclick="add('^')">xʸ</button>

<button class="function" onclick="add('Math.PI')">π</button>

<button class="function" onclick="add('Math.E')">e</button>

<button class="function" onclick="add('(')">(</button>

<button class="function" onclick="add(')')">)</button>


<button class="number" onclick="add('7')">7</button>

<button class="number" onclick="add('8')">8</button>

<button class="number" onclick="add('9')">9</button>

<button class="operator" onclick="add('/')">÷</button>

<button class="operator" onclick="add('*')">×</button>


<button class="number" onclick="add('4')">4</button>

<button class="number" onclick="add('5')">5</button>

<button class="number" onclick="add('6')">6</button>

<button class="operator" onclick="add('-')">−</button>

<button class="operator" onclick="add('+')">+</button>


<button class="number" onclick="add('1')">1</button>

<button class="number" onclick="add('2')">2</button>

<button class="number" onclick="add('3')">3</button>

<button class="number" onclick="add('0')">0</button>

<button class="number" onclick="add('.')">.</button>


<button class="equal"
style="grid-column:span 5;"
onclick="calculate()">
=
</button>


</div>

</div>

</div>


<footer>

<p>

<script>

let degreeMode = true;


/* Display */

function display(){

    return document.getElementById("display");

}


/* Add text */

function add(value){

    display().value += value;

}


/* Scientific functions */

function func(name){

    display().value += name + "(";

}


/* Clear */

function clearDisplay(){

    display().value = "";

}


/* Backspace */

function backspace(){

    display().value =
    display().value.slice(0,-1);

}


/* DEG / RAD */

function toggleMode(){

    degreeMode = !degreeMode;

    document.getElementById("mode").innerText =
    degreeMode ? "DEG" : "RAD";

}


/* Square */

function square(){

    display().value += "^2";

}


/* Calculate */

function calculate(){

    let expression =
    display().value;


    try{


        /* Power */

        expression =
        expression.replaceAll("^","**");


        /* Square root */

        expression =
        expression.replaceAll(
            "sqrt(",
            "Math.sqrt("
        );


        /* Log */

        expression =
        expression.replaceAll(
            "log(",
            "Math.log10("
        );


        /* Natural log */

        expression =
        expression.replaceAll(
            "ln(",
            "Math.log("
        );


        /*
        IMPORTANT:
        Inverse functions are replaced FIRST.
        */
if(degreeMode){

    expression = expression.replace(
        /asin\(([^()]*)\)/g,
        "INVASIN($1)"
    );

    expression = expression.replace(
        /acos\(([^()]*)\)/g,
        "INVACOS($1)"
    );

    expression = expression.replace(
        /atan\(([^()]*)\)/g,
        "INVATAN($1)"
    );


    expression = expression.replace(
        /sin\(([^()]*)\)/g,
        "Math.sin(($1)*Math.PI/180)"
    );

    expression = expression.replace(
        /cos\(([^()]*)\)/g,
        "Math.cos(($1)*Math.PI/180)"
    );

    expression = expression.replace(
        /tan\(([^()]*)\)/g,
        "Math.tan(($1)*Math.PI/180)"
    );


    expression = expression.replace(
        /INVASIN\(([^()]*)\)/g,
        "(Math.asin($1)*180/Math.PI)"
    );

    expression = expression.replace(
        /INVACOS\(([^()]*)\)/g,
        "(Math.acos($1)*180/Math.PI)"
    );

    expression = expression.replace(
        /INVATAN\(([^()]*)\)/g,
        "(Math.atan($1)*180/Math.PI)"
    );

    } 

            expression =
            expression.replace(
                /cos\(([^()]*)\)/g,
                "Math.cos(($1)*Math.PI/180)"
            );

            expression =
            expression.replace(
                /tan\(([^()]*)\)/g,
                "Math.tan(($1)*Math.PI/180)"
            );

        }

        else{

            expression =
            expression.replaceAll(
                "asin(",
                "Math.asin("
            );

            expression =
            expression.replaceAll(
                "acos(",
                "Math.acos("
            );

            expression =
            expression.replaceAll(
                "atan(",
                "Math.atan("
            );

            expression =
            expression.replaceAll(
                "sin(",
                "Math.sin("
            );

            expression =
            expression.replaceAll(
                "cos(",
                "Math.cos("
            );

            expression =
            expression.replaceAll(
                "tan(",
                "Math.tan("
            );

        }


        /* Calculate */

        let answer =
        Function(
            '"use strict"; return (' +
            expression +
            ')'
        )();


        /* Remove floating point noise */

        if(
            Math.abs(answer) < 0.000000000001
        ){

            answer = 0;

        }


        display().value =
        Number(answer.toFixed(10));


    }

    catch(error){

        display().value =
        "Error";

    }

}

</script>
