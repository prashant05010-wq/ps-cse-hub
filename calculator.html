<script>
<script>

let degreeMode = true;

function append(value) {
    document.getElementById("display").value += value;
}

function clearDisplay() {
    document.getElementById("display").value = "";
}

function backspace() {
    let display = document.getElementById("display");
    display.value = display.value.slice(0, -1);
}

function toggleDegree() {

    degreeMode = !degreeMode;

    document.getElementById("modeText").innerText =
        degreeMode ? "DEG" : "RAD";
}

function sin(x) {
    return degreeMode
        ? Math.sin(x * Math.PI / 180)
        : Math.sin(x);
}

function cos(x) {
    return degreeMode
        ? Math.cos(x * Math.PI / 180)
        : Math.cos(x);
}

function tan(x) {
    return degreeMode
        ? Math.tan(x * Math.PI / 180)
        : Math.tan(x);
}

function asin(x) {

    let result = Math.asin(x);

    return degreeMode
        ? result * 180 / Math.PI
        : result;
}

function acos(x) {

    let result = Math.acos(x);

    return degreeMode
        ? result * 180 / Math.PI
        : result;
}

function atan(x) {

    let result = Math.atan(x);

    return degreeMode
        ? result * 180 / Math.PI
        : result;
}

function factorial() {

    let display = document.getElementById("display");

    let n = Number(display.value);

    if (n < 0 || !Number.isInteger(n)) {
        display.value = "Error";
        return;
    }

    let result = 1;

    for (let i = 1; i <= n; i++) {
        result *= i;
    }

    display.value = result;
}

function calculate() {

    let display = document.getElementById("display");

    let expression = display.value;

    try {

        expression = expression.replaceAll("PI", "Math.PI");
        expression = expression.replaceAll("sqrt", "Math.sqrt");
        expression = expression.replaceAll("log", "Math.log10");
        expression = expression.replaceAll("ln", "Math.log");
        expression = expression.replaceAll("^", "**");
        expression = expression.replaceAll("E", "Math.E");

        let result = Function(
            "sin",
            "cos",
            "tan",
            "asin",
            "acos",
            "atan",
            '"use strict"; return (' + expression + ')'
        )(
            sin,
            cos,
            tan,
            asin,
            acos,
            atan
        );

        display.value = result;

    }

    catch(error) {

        display.value = "Error";

    }

}

</script>
