*{box-sizing:border-box;scroll-behavior:smooth}

body{
margin:0;
font-family:Arial,sans-serif;
background:#07111f;
color:white;
line-height:1.6;
}

header{
background:#050d18;
padding:18px 20px;
border-bottom:1px solid #24415f;
}

.nav{
max-width:1100px;
margin:auto;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
color:#39a7ff;
font-size:23px;
font-weight:bold;
}

.logo span{color:white}

.nav a{
color:#d5e4f2;
text-decoration:none;
margin-left:18px;
}

.hero{
text-align:center;
padding:65px 20px;
background:radial-gradient(circle at top,#124477,#07111f 65%);
}

.hero h1{
font-size:48px;
margin:0 0 10px;
}

.hero h1 span{color:#39a7ff}

.hero p{color:#b8c9da}

.container{
max-width:1100px;
margin:auto;
padding:55px 20px;
}

.title{
text-align:center;
margin-bottom:40px;
}

.title h2{font-size:35px}

.title p{color:#93a7ba}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
gap:22px;
}

.card{
background:#0c1b2d;
border:1px solid #24415f;
border-radius:18px;
padding:28px;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
border-color:#1688ff;
}

.icon{
font-size:40px;
margin-bottom:12px;
}

.card h3{color:#4db2ff}

.card p{color:#bdcad7}

.btn{
display:inline-block;
margin-top:15px;
padding:11px 22px;
background:#1688ff;
color:white;
text-decoration:none;
border-radius:25px;
font-weight:bold;
}

.btn:hover{background:#39a7ff}

.info{
margin-top:45px;
padding:28px;
background:#0a1727;
border:1px solid #24415f;
border-radius:18px;
}

.info h2{color:#4db2ff}

.info p,.info li{color:#bdcad7}

footer{
background:#030912;
text-align:center;
padding:30px 20px;
color:#8192a6;
}

footer strong{color:#39a7ff}

@media(max-width:650px){

.nav{
flex-direction:column;
gap:10px;
}

.nav a{
margin:0 7px;
