<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PS CSE HUB | CSE Notes, Coding & Projects</title>

<meta name="description" content="PS CSE HUB - CSE notes, C programming, coding resources, projects and study material.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
    scroll-behavior:smooth;
}

body{
    background:#07111f;
    color:white;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#050d18;
    border-bottom:1px solid #193451;
}

.navbar{
    max-width:1100px;
    margin:auto;
    padding:16px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#39a7ff;
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:white;
}

nav a{
    color:#d7e5f2;
    text-decoration:none;
    margin-left:18px;
    font-size:14px;
}

nav a:hover{
    color:#39a7ff;
}

.hero{
    min-height:85vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:50px 20px;
    background:radial-gradient(circle at top,#12477d,#07111f 60%);
}

.hero h1{
    font-size:clamp(42px,8vw,72px);
    margin-bottom:18px;
}

.hero h1 span{
    color:#39a7ff;
}

.hero p{
    max-width:700px;
    margin:auto;
    color:#b8c9da;
    font-size:18px;
    line-height:1.7;
}

.btn{
    display:inline-block;
    margin-top:25px;
    padding:13px 27px;
    background:#1688ff;
    color:white;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
}

.btn:hover{
    background:#39a7ff;
}

section{
    padding:75px 20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.title{
    text-align:center;
    margin-bottom:40px;
}

.title h2{
    font-size:35px;
}

.title p{
    color:#93a7ba;
    margin-top:8px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:22px;
}

.card{
    background:#0c1b2d;
    border:1px solid #1c3855;
    border-radius:18px;
    padding:28px;
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
    border-color:#1688ff;
}

.icon{
    font-size:38px;
    margin-bottom:15px;
}

.card h3{
    color:#4db2ff;
    margin-bottom:10px;
}

.card p{
    color:#b5c5d5;
    line-height:1.6;
}

.card-btn{
    display:inline-block;
    margin-top:18px;
    color:#4db2ff;
    text-decoration:none;
    font-weight:bold;
}

.feature{
    background:#091827;
}

.feature-box{
    max-width:800px;
    margin:auto;
    text-align:center;
}

.feature-box h2{
    font-size:34px;
    margin-bottom:15px;
}

.feature-box p{
    color:#b5c5d5;
    line-height:1.7;
}

.about{
